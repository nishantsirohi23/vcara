# Full V-CARA run. Mirrors Cfg defaults plus VARIANTS["vcara"] in src/vcara/core.py.
variant: vcara
total_frames: 1000000        # paper reports to 1M; code default is 2M
seeds: [42]                  # paper's four-seed return analysis (A-D): add their seed values here
action_repeat: 4
img: 64
stack: 4
time_limit: 1000
time_aware: true
stall_mode: terminal_penalty
brake_deadzone: 0.6
gamma: 0.99
tau: 0.005
actor_lr: 1.0e-4
critic_lr: 2.0e-4
batch: 256
buffer: 300000
ensemble: 3
fixed_horizon: 3
use_cf: true
use_gate: true
use_risk: true
use_progress: true
use_finish: true
use_elite_replay: true
cf_margin: 0.02
cf_uncertainty_limit: 1.5
cf_target_rate: 0.25
cf_warmup: 10000
cf_ramp: 10000
beta: 0.3
lam: 0.01
eval_every: 25000
eval_episodes: 10
