[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcara"
version = "0.3.1"
description = "Uncertainty-gated counterfactual RL for visual control on CarRacing-v3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nishant Sirohi" }]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "gymnasium[box2d]>=0.29",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ppo = ["stable-baselines3>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
